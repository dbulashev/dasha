name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Install linters
        run: |
          go install github.com/mgechev/revive@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Lint Go
        run: |
          cd backend
          revive -config revive.toml -formatter friendly -exclude ./gen/... ./...
          gosec -quiet -exclude-dir=gen ./...

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  test-backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - run: cd backend && go test ./internal/...

  vulncheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: cd backend && govulncheck ./...

  vulncheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run npm audit
        run: cd frontend && npm audit --audit-level=high

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Trivy config scan (Dockerfile/Helm misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: demo

  test-backend-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Integration tests (PG ${{ matrix.pg-version }})
        run: |
          cd backend
          POSTGRES_VERSION=${{ matrix.pg-version }} go test -tags=integration -v -timeout=5m ./internal/repository/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      # - run: cd frontend && npm run test:unit

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Helm lint
        run: helm lint deploy/charts/dasha
      - name: Helm template
        run: helm template test deploy/charts/dasha > /dev/null

  # Report-only: never gates CI and is deliberately kept out of build-check's needs,
  # because release.yaml gates releases on the build-check check-run.
  sonar:
    runs-on: ubuntu-latest
    # Forks get no secrets: skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # blame data for New Code; a shallow clone degrades relevance
          persist-credentials: false # the scanner only reads history, it never pushes
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      # Without a report Sonar reads coverage as 0% and the Quality Gate fails on
      # every pull request that adds code. Integration tests are included because
      # most of the repository layer is only reachable against a real PostgreSQL;
      # one version is enough for coverage, the CI matrix covers 14-18 separately.
      - name: Tests with coverage
        continue-on-error: true # a coverage gap must not turn into a red job
        run: |
          cd backend
          go test -tags=integration -timeout=15m -covermode=atomic \
            -coverpkg=./internal/... -coverprofile=coverage-sonar.out ./internal/...
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend

  build-check:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, lint-helm, test-backend-unit, test-frontend, vulncheck-backend, vulncheck-frontend, trivy-scan]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - run: cd backend && go build ./cmd/...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
