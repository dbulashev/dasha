name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Install linters
        run: |
          go install github.com/mgechev/revive@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Lint Go
        run: |
          cd backend
          revive -config revive.toml -formatter friendly -exclude ./gen/... ./...
          gosec -quiet -exclude-dir=gen ./...

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

  test-backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - run: cd backend && go test ./internal/...

  vulncheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: cd backend && govulncheck ./...

  vulncheck-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run npm audit
        run: cd frontend && npm audit --audit-level=high

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Trivy config scan (Dockerfile/Helm misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: demo

  test-backend-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Integration tests (PG ${{ matrix.pg-version }})
        run: |
          cd backend
          POSTGRES_VERSION=${{ matrix.pg-version }} go test -tags=integration -v -timeout=10m \
            ./internal/repository/ ./internal/discovery/postgres/ ./internal/storage/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check locale files
        run: frontend/scripts/check-locales.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      # - run: cd frontend && npm run test:unit

  # The frontend image runs nginx as a non-root user, so a missing write permission
  # inside it only surfaces at startup — build the image and actually serve a request.
  smoke-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/images/Dockerfile.frontend
          push: false
          load: true
          tags: dasha-frontend:ci
          build-args: |
            BUILD_NUMBER=ci
      # BACKEND_URL points at nothing on purpose: nginx resolves the upstream name at
      # startup, so the default "backend" would fail here for the wrong reason.
      - name: Serve a request
        run: |
          serve_check() {
            name="$1"
            shift
            docker run -d --name "$name" "$@" \
              -e BACKEND_URL=127.0.0.1:8000 -p 3000:3000 dasha-frontend:ci
            for _ in $(seq 30); do
              if curl -fsS -o /dev/null http://localhost:3000/; then
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 1
            done
            echo "::error::frontend did not serve / within 30s ($name)"
            docker logs "$name"
            return 1
          }

          serve_check frontend-smoke
          # nginx writes its rendered configs and temp dirs as the container user, so
          # a uid it does not own breaks startup. OpenShift assigns a random one and
          # guarantees only gid 0 — the image must survive that, not just its own uid.
          serve_check frontend-smoke-uid --user 12345:0

  # Same idea for the backend image: it runs migrations at startup as a non-root user,
  # so let it come up against a real PostgreSQL and answer a request.
  smoke-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/images/Dockerfile.backend
          push: false
          load: true
          tags: dasha-backend:ci
          build-args: |
            BUILD_NUMBER=ci
      # storage.dsn is set so the image's "dasha migrate" step actually runs the
      # migrations; --network host reaches the service container's mapped port.
      - name: Serve a request
        run: |
          cat > /tmp/dasha.yaml <<'EOF'
          clusters:
            - name: ci
              username: postgres
              password: postgres
              databases: [postgres]
              hosts: [127.0.0.1]
          storage:
            dsn: postgres://postgres:postgres@127.0.0.1:5432/postgres
          EOF
          docker run -d --name backend-smoke --network host \
            -v /tmp/dasha.yaml:/etc/dasha/dasha.yaml:ro dasha-backend:ci
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8000/api/clusters | grep -q '"ci"'; then exit 0; fi
            sleep 1
          done
          echo "::error::backend did not answer /api/clusters within 30s"
          docker logs backend-smoke
          exit 1

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Helm lint
        run: helm lint deploy/charts/dasha
      - name: Helm template
        run: helm template test deploy/charts/dasha > /dev/null
      - name: Helm render tests
        run: deploy/charts/dasha/tests/render-tests.sh

  # Disabled: the free Sonar plan pins the Quality Gate at 80% coverage on New Code
  # and the threshold cannot be changed, so the job stayed permanently red.
  # Re-enable by uncommenting once coverage clears the gate or the plan allows a
  # custom gate.
  # sonar:
  #   runs-on: ubuntu-latest
  #   # Forks get no secrets: skip instead of failing.
  #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0 # blame data for New Code; a shallow clone degrades relevance
  #         persist-credentials: false # the scanner only reads history, it never pushes
  #     - uses: actions/setup-go@v7
  #       with:
  #         go-version: "1.26.5"
  #         cache-dependency-path: backend/go.sum
  #     # Without a report Sonar reads coverage as 0% and the Quality Gate fails on
  #     # every pull request that adds code. Integration tests are included because
  #     # most of the repository layer is only reachable against a real PostgreSQL;
  #     # one version is enough for coverage, the CI matrix covers 14-18 separately.
  #     - name: Tests with coverage
  #       continue-on-error: true # a coverage gap must not turn into a red job
  #       run: |
  #         cd backend
  #         go test -tags=integration -timeout=15m -covermode=atomic \
  #           -coverpkg=./internal/... -coverprofile=coverage-sonar.out ./internal/...
  #     - name: SonarQube Cloud scan
  #       uses: SonarSource/sonarqube-scan-action@v8
  #       continue-on-error: true
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       with:
  #         projectBaseDir: backend

  build-check:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, lint-helm, test-backend-unit, test-frontend, smoke-frontend, smoke-backend, vulncheck-backend, vulncheck-frontend, trivy-scan]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - run: cd backend && go build ./cmd/...
      # ./cmd/... already compiles the MCP binary, but release ships it from
      # Dockerfile.mcp — build that image (no push) so a broken image build shows
      # up here instead of at tag time.
      - uses: docker/setup-buildx-action@v4
      - name: Build MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/images/Dockerfile.mcp
          push: false
          build-args: |
            BUILD_NUMBER=ci
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
