sonar.organization=dbulashev
sonar.projectKey=dbulashev_dasha
sonar.projectName=Dasha

# Analysis scope: Go backend only. Frontend, Helm charts and SQL templates are out of scope.
# projectBaseDir is set to backend/ by the workflow so that Go coverage paths
# (prefixed with the go.mod module path) resolve against indexed files.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# *_test.go must be excluded from sources, otherwise the scanner indexes them twice.
sonar.exclusions=gen/**,internal/enums/query_enum.go,**/*_test.go,**/testdata/**

# CLI wiring and code generators are not unit-testable. Rules still apply to them,
# they are only kept out of the coverage denominator (files with no report count as 0%).
sonar.coverage.exclusions=cmd/**

sonar.sourceEncoding=UTF-8
