debug: true
# Внешний URL-префикс; DASHA_BASE_PATH переопределяет это значение.
base_path: ""
clusters:
  - name: home
    username: postgres
    password: postgres
    databases:
      - postgres
    hosts:
      - localhost
      - my-postgresql.domain.local
  - name: home2
    username: postgres
    password: postgres
    databases:
      - postgres
    hosts:
      - localhost
      - my-postgresql.domain.local
  - name: home-2
    username: postgres
    password: postgres
    databases:
      - postgres
    hosts:
      - localhost
      - my-postgresql.domain.local

