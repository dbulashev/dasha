[SERVICE]
    Flush             2
    Daemon            off
    Log_Level         info
    Parsers_File      parsers-pg.conf

# One input per PostgreSQL host: the tag carries cluster and host, which the
# filters turn into record fields and the outputs into an index name.
[INPUT]
    Name              tail
    Tag               pg.pg18-cluster.pg18-master
    Path              /pg-logs/pg18-master/*.json
    Parser            pg_jsonlog
    DB                /var/lib/fluent-bit/pg18-master.db
    Refresh_Interval  5
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     64MB

[INPUT]
    Name              tail
    Tag               pg.pg18-cluster.pg18-replica
    Path              /pg-logs/pg18-replica/*.json
    Parser            pg_jsonlog
    DB                /var/lib/fluent-bit/pg18-replica.db
    Refresh_Interval  5
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     64MB

[INPUT]
    Name              tail
    Tag               pg.pg17-cluster.pg17-master
    Path              /pg-logs/pg17-master/*.json
    Parser            pg_jsonlog
    DB                /var/lib/fluent-bit/pg17-master.db
    Refresh_Interval  5
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     64MB

[INPUT]
    Name              tail
    Tag               pg.pg17-cluster.pg17-replica-1
    Path              /pg-logs/pg17-replica-1/*.json
    Parser            pg_jsonlog
    DB                /var/lib/fluent-bit/pg17-replica-1.db
    Refresh_Interval  5
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     64MB

[INPUT]
    Name              tail
    Tag               pg.pg17-cluster.pg17-replica-2
    Path              /pg-logs/pg17-replica-2/*.json
    Parser            pg_jsonlog
    DB                /var/lib/fluent-bit/pg17-replica-2.db
    Refresh_Interval  5
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     64MB

[INPUT]
    Name              tail
    Tag               pg.pg18-standalone.pg18-standalone
    Path              /pg-logs/pg18-standalone/*.json
    Parser            pg_jsonlog
    DB                /var/lib/fluent-bit/pg18-standalone.db
    Refresh_Interval  5
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     64MB

# pgbouncer logs to stdout, so its container ships them here through the docker
# fluentd driver (demo/docker-compose.metrics.yaml).
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Max_Size   1M
    Mem_Buf_Limit     16MB

# The log stream of a record is {cluster, host, app}; the pooler shares cluster
# and host with the master it fronts, so only app tells the two streams apart.
[FILTER]
    Name              record_modifier
    Match             pg.*
    Record            app postgres

[FILTER]
    Name              record_modifier
    Match             pooler.*
    Record            app pgbouncer

[FILTER]
    Name              record_modifier
    Match             pg.pg18-cluster.pg18-master
    Record            host pg18-master
    Record            cluster pg18-cluster

[FILTER]
    Name              record_modifier
    Match             pg.pg18-cluster.pg18-replica
    Record            host pg18-replica
    Record            cluster pg18-cluster

[FILTER]
    Name              record_modifier
    Match             pg.pg17-cluster.pg17-master
    Record            host pg17-master
    Record            cluster pg17-cluster

[FILTER]
    Name              record_modifier
    Match             pg.pg17-cluster.pg17-replica-1
    Record            host pg17-replica-1
    Record            cluster pg17-cluster

[FILTER]
    Name              record_modifier
    Match             pg.pg17-cluster.pg17-replica-2
    Record            host pg17-replica-2
    Record            cluster pg17-cluster

[FILTER]
    Name              record_modifier
    Match             pg.pg18-standalone.pg18-standalone
    Record            host pg18-standalone
    Record            cluster pg18-standalone

[FILTER]
    Name              parser
    Match             pooler.*
    Key_Name          log
    Parser            pgbouncer
    Reserve_Data      On

# Container entrypoint output does not match the pgbouncer format: it keeps the
# raw line in "log" and carries no level of its own.
[FILTER]
    Name              modify
    Match             pooler.*
    Condition         Key_Does_Not_Exist msg
    Rename            log msg
    Set               level LOG

# The pooler fronts pg18-master and the host filter narrows by cluster hosts, so
# the record carries the host it pools for, not the pgbouncer container.
[FILTER]
    Name              record_modifier
    Match             pooler.pg18-cluster.pgbouncer
    Record            host pg18-master
    Record            cluster pg18-cluster

# One log stream per {cluster, host, app}; the retention of the store drops the
# records after three days.
[OUTPUT]
    Name              http
    Match             pg.*
    Host              victorialogs
    Port              9428
    URI               /insert/jsonline?_stream_fields=cluster,host,app&_msg_field=message&_time_field=date
    Format            json_lines
    Json_date_key     date
    Json_date_format  iso8601
    Compress          gzip
    Retry_Limit       5

[OUTPUT]
    Name              http
    Match             pooler.*
    Host              victorialogs
    Port              9428
    URI               /insert/jsonline?_stream_fields=cluster,host,app&_msg_field=msg&_time_field=date
    Format            json_lines
    Json_date_key     date
    Json_date_format  iso8601
    Compress          gzip
    Retry_Limit       5

