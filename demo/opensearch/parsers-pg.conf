[PARSER]
    Name        pg_jsonlog
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%L %Z
    Time_Keep   On

[PARSER]
    Name        pgbouncer
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ [A-Z]{2,5}) \[(?<pid>\d+)\] (?<level>[A-Z]+) (?<msg>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L %Z
    Time_Keep   Off
